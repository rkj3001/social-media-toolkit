[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "social-media-toolkit"
version = "0.1.0"
description = "Local-first tools for collecting and organizing authorized social media."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "instaloader>=4.14,<5",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
smt-downloader = "social_media_toolkit.downloader.run:main"
smt-download = "social_media_toolkit.downloader.cli:main"
smt-migrate = "social_media_toolkit.database.migrate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/social_media_toolkit"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
